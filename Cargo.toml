[package]
name = "nbsp"
description = "non-breaking space: a thoughtful community forum platform"
repository = "https://github.com/bearbearean/nbsp"
license = "AGPL-3.0-or-later"
edition = "2024"
version = "0.0.5"

[lints]
rust.missing_docs = "warn"
clippy.missing_docs_in_private_items = "warn"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
askama = { version = "0.16.0", features = ["urlencode"] }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-private"] }
base64ct = "1.8.3"
chrono = "0.4.45"
cookie = "0.18.2"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
memory-serve = "2.3.0"
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
percent-encoding = "2.3.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["request-id", "sensitive-headers", "set-header", "trace", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[build-dependencies]
memory-serve = "2.3.0"
