{% extends "base.html" %}

{% block body %}
<header class="container page-header">
  <img class="logo" src="/assets/nbsp-logo.png" alt="nbsp">
  <h1 class="title">{{ config.nbsp_community_title }}</h1>
  <p class="subtitle">{{ config.nbsp_community_subtitle }}</p>
</header>

<main class="container">
  {% if let Some(notice) = config.nbsp_homepage_notice %}
  <div class="homepage-notice">
    <p>{{ notice|safe }}</p>
  </div>
  {% endif %}

  <div class="two-col-wrapper">
    <div class="register-an-account">
      <p>Have an invite code?</p>
      <a href="/account/register">Create your account here</a>
    </div>

    <div class="login-existing-account">
      <p>Already a member?</p>
      <a href="/account/login">Log in here</a>
    </div>
  </div>
</main>
{% endblock %}
